services:
  - type: web
    name: storytoon-ai
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: VIDEO_MODEL
        value: sora-2
      - key: VIDEO_SECONDS
        value: 8
      - key: MAX_SCENES
        value: 6
